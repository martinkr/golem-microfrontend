<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microfrontend App Shell (React + Vue</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #f9fafb;
      }

      .app-container {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .header-frame {
        width: 100%;
        height: 80px;
        border: none;
        background: white;
      }

      .content-frame {
        flex: 1;
        width: 100%;
        border: none;
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <iframe
        id="header-frame"
        class="header-frame"
        src="http://localhost:3001"
        title="Header"
      ></iframe>
      <iframe
        id="content-frame"
        class="content-frame"
        src="http://localhost:3002"
        title="Product"
      ></iframe>
    </div>

    <script>
      const headerFrame = document.getElementById("header-frame");
      const contentFrame = document.getElementById("content-frame");

      window.addEventListener("message", (event) => {
        if (
          !["http://localhost:3001", "http://localhost:3002"].includes(
            event.origin
          )
        )
          return;

        const msg = event.data;

        // Nachricht vom Content-Microfrontend erhalten
        if (msg.type === "cart:update") {
          headerFrame.contentWindow.postMessage(msg, "http://localhost:3001");
        }

        // Nachricht an Header-Microfrontend senden
        if (msg.type === "cart:request") {
          contentFrame.contentWindow.postMessage(msg, "http://localhost:3002");
        }
      });
    </script>
  </body>
</html>
